services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@db:5432/rag
      APP_DATABASE_URL: postgresql://rag_app:rag_app@db:5432/rag
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
